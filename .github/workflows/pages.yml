# Publish the games to GitHub Pages.
#
# They are pure static files, so there is nothing to build — the repo root
# is uploaded as-is. Pages serves over https, which matters: getUserMedia
# only works in a secure context, so the webcam tracking needs https (or
# localhost). A file:// page cannot use the camera at all, and cannot load
# ES modules either.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # turn Pages on the first time this runs, so no manual setup step
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
